name: SAM2 Attack Sprite Tracking Smoke

on:
  push:
    branches:
      - sam2-smoke
    paths:
      - ".github/workflows/sam2-smoke.yml"
      - ".github/fixtures/sam2-melee/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attack-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      SMOKE_DIR: tools/sprite-teamcolor-sam2-smoke
      SAM2_COMMIT: 2b90b9f5ceec907a1c18123530e92e794ad901a4
      CHECKPOINT_URL: https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_tiny.pt
      MELEE_TRANSPORT_SHA256: 6ec1e8a3c666fd29c3109df1482581fb47991c3db2f36d5010d4893e4cd7208b

    steps:
      - name: Checkout sam2-smoke
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install             torch==2.7.1 torchvision==0.22.1             --index-url https://download.pytorch.org/whl/cpu

      - name: Install official SAM 2
        env:
          SAM2_BUILD_CUDA: "0"
        run: |
          git clone https://github.com/facebookresearch/sam2.git "$RUNNER_TEMP/sam2"
          git -C "$RUNNER_TEMP/sam2" checkout "$SAM2_COMMIT"
          python -m pip install -e "$RUNNER_TEMP/sam2"
          python -m pip install pillow numpy

      - name: Download official SAM 2.1 Hiera Tiny checkpoint
        run: |
          mkdir -p "$SMOKE_DIR/models"
          curl -L --fail --retry 3 --retry-delay 2             "$CHECKPOINT_URL"             -o "$SMOKE_DIR/models/sam2.1_hiera_tiny.pt"
          sha256sum "$SMOKE_DIR/models/sam2.1_hiera_tiny.pt" | tee "$SMOKE_DIR/checkpoint_sha256.txt"

      - name: Reconstruct Melee row-0 fixture
        run: |
          cat .github/fixtures/sam2-melee/part*.b64 | base64 -d > "$RUNNER_TEMP/Melee_row0_smoke.webp"
          echo "$MELEE_TRANSPORT_SHA256  $RUNNER_TEMP/Melee_row0_smoke.webp" | sha256sum -c -
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path("/home/runner/work/_temp/Melee_row0_smoke.webp")
          im = Image.open(p).convert("RGBA")
          im.load()
          print("size:", im.size)
          print("mode:", im.mode)
          if im.size != (1920, 1024):
              raise SystemExit(f"unexpected size: {im.size}")
          alpha = im.getchannel("A")
          if alpha.getbbox() is None:
              raise SystemExit("fixture has no visible pixels")
          # Save as RGBA PNG so smoke.py validates mode/alpha exactly.
          out = Path("/home/runner/work/_temp/Melee.png")
          im.save(out)
          print("fixture ready:", out, out.stat().st_size)
          PY

      - name: Validate smoke utility
        run: |
          python "$SMOKE_DIR/src/test_smoke.py"

      - name: Run Melee row-0 SAM 2 smoke
        run: |
          rm -rf "$SMOKE_DIR/output-attack" "$SMOKE_DIR/temp-attack"
          python "$SMOKE_DIR/src/smoke.py"             --input "$RUNNER_TEMP/Melee.png"             --output "$SMOKE_DIR/output-attack"             --temp "$SMOKE_DIR/temp-attack"             --positive 58,58             --negative 67,51             --negative 52,67             --negative 68,64             --device cpu

      - name: Print attack metrics summary
        if: always()
        run: |
          if [ -f "$SMOKE_DIR/output-attack/metrics.json" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("tools/sprite-teamcolor-sam2-smoke/output-attack/metrics.json")
          d = json.loads(p.read_text())
          print("status:", d.get("status"))
          print("prompts:", d.get("prompts"))
          print("timing_seconds:", d.get("timing_seconds"))
          print("automated_screening:", d.get("automated_screening"))
          for f in d.get("frames", []):
              print(
                  f"frame={f['frame']:02d} "
                  f"area={f['mask_pixel_area']} "
                  f"iou={f['previous_frame_mask_iou']} "
                  f"bbox={f['mask_bounding_box_xyxy']}"
              )
          PY
          else
            echo "attack metrics.json not generated"
          fi

      - name: Upload attack smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam2-attack-smoke
          if-no-files-found: warn
          retention-days: 7
          path: |
            tools/sprite-teamcolor-sam2-smoke/output-attack/
            tools/sprite-teamcolor-sam2-smoke/checkpoint_sha256.txt
            tools/sprite-teamcolor-sam2-smoke/temp-attack/frame_000_prompt.png
