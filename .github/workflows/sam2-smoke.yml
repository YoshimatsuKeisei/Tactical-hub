name: SAM2 Attack Sprite Tracking Smoke

on:
  push:
    branches:
      - sam2-smoke
    paths:
      - ".github/workflows/sam2-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attack-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      SMOKE_DIR: tools/sprite-teamcolor-sam2-smoke
      SAM2_COMMIT: 2b90b9f5ceec907a1c18123530e92e794ad901a4
      CHECKPOINT_URL: https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_tiny.pt
      KNIGHT_DOWNLOAD_GATEWAY: https://smallscaleint.itch.io/hd-8-directional-top-down-character-pack-1/download/eyJleHBpcmVzIjoxNzkxMjgwNjA3LCJpZCI6MjkyMzI1Nn0=.vBTIbsHo4DDvaX7oOUoZi0X8Njs=

    steps:
      - name: Checkout sam2-smoke
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch==2.7.1 torchvision==0.22.1 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install official SAM 2
        env:
          SAM2_BUILD_CUDA: "0"
        run: |
          git clone https://github.com/facebookresearch/sam2.git "$RUNNER_TEMP/sam2"
          git -C "$RUNNER_TEMP/sam2" checkout "$SAM2_COMMIT"
          python -m pip install -e "$RUNNER_TEMP/sam2"
          python -m pip install pillow numpy

      - name: Download official SAM 2.1 Hiera Tiny checkpoint
        run: |
          mkdir -p "$SMOKE_DIR/models"
          curl -L --fail --retry 3 --retry-delay 2 \
            "$CHECKPOINT_URL" \
            -o "$SMOKE_DIR/models/sam2.1_hiera_tiny.pt"
          sha256sum "$SMOKE_DIR/models/sam2.1_hiera_tiny.pt" | tee "$SMOKE_DIR/checkpoint_sha256.txt"

      - name: Download free HD Knight pack and extract Melee.png
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            -A "Mozilla/5.0" \
            "$KNIGHT_DOWNLOAD_GATEWAY" \
            -o "$RUNNER_TEMP/knight-download"
          file "$RUNNER_TEMP/knight-download"
          python - <<'PY'
          from pathlib import Path
          import zipfile

          src = Path("/home/runner/work/_temp/knight-download")
          data = src.read_bytes()
          print("downloaded bytes:", len(data))
          print("signature:", data[:16])

          if not zipfile.is_zipfile(src):
              raise SystemExit("itch.io gateway did not return the Knight ZIP")

          with zipfile.ZipFile(src) as zf:
              names = zf.namelist()
              matches = [n for n in names if n.lower().endswith("/melee.png")]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one Melee.png, found: {matches}")
              out = Path("/home/runner/work/_temp/Melee.png")
              out.write_bytes(zf.read(matches[0]))
              print("extracted:", matches[0])
              print("saved:", out, out.stat().st_size)
          PY

      - name: Verify Melee.png
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path("/home/runner/work/_temp/Melee.png")
          im = Image.open(p)
          im.load()
          print("size:", im.size)
          print("mode:", im.mode)
          if im.size != (1920, 1024):
              raise SystemExit(f"unexpected size: {im.size}")
          if im.mode != "RGBA":
              raise SystemExit(f"unexpected mode: {im.mode}")
          PY

      - name: Validate smoke utility
        run: |
          python "$SMOKE_DIR/src/test_smoke.py"

      - name: Run Melee row-0 SAM 2 smoke
        run: |
          rm -rf "$SMOKE_DIR/output-attack" "$SMOKE_DIR/temp-attack"
          python "$SMOKE_DIR/src/smoke.py" \
            --input "$RUNNER_TEMP/Melee.png" \
            --output "$SMOKE_DIR/output-attack" \
            --temp "$SMOKE_DIR/temp-attack" \
            --positive 67,51 \
            --negative 70,54 \
            --negative 58,61 \
            --negative 66,69 \
            --device cpu

      - name: Print attack metrics summary
        if: always()
        run: |
          if [ -f "$SMOKE_DIR/output-attack/metrics.json" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("tools/sprite-teamcolor-sam2-smoke/output-attack/metrics.json")
          d = json.loads(p.read_text())
          print("status:", d.get("status"))
          print("timing_seconds:", d.get("timing_seconds"))
          print("automated_screening:", d.get("automated_screening"))
          for f in d.get("frames", []):
              print(
                  f"frame={f['frame']:02d} "
                  f"area={f['mask_pixel_area']} "
                  f"iou={f['previous_frame_mask_iou']} "
                  f"bbox={f['mask_bounding_box_xyxy']}"
              )
          PY
          else
            echo "attack metrics.json not generated"
          fi

      - name: Upload attack smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam2-attack-smoke
          if-no-files-found: warn
          retention-days: 7
          path: |
            tools/sprite-teamcolor-sam2-smoke/output-attack/
            tools/sprite-teamcolor-sam2-smoke/checkpoint_sha256.txt
            tools/sprite-teamcolor-sam2-smoke/temp-attack/frame_000_prompt.png
