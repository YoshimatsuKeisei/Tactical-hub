name: Sprite Team Color GUI Tests

on:
  push:
    branches:
      - sprite-teamcolor-gui
    paths:
      - "tools/sprite-teamcolor-gui/**"
      - ".github/workflows/sprite-teamcolor-gui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "Pillow>=11,<13"

      - name: Compile Python sources
        working-directory: tools/sprite-teamcolor-gui
        run: |
          python -m py_compile core.py sam_backend.py app.py

      - name: Run core unit tests
        working-directory: tools/sprite-teamcolor-gui
        run: |
          python -m unittest discover -s tests -v
